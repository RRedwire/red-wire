<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory — RedArcade</title>
    <meta name="description" content="Memory — an original RedArcade browser game." />
    <meta name="theme-color" content="#141216" />
    <link rel="icon" href="/assets/img/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/org.css?v=2" />
    <link rel="stylesheet" href="/play/play.css?v=2" />
  </head>
  <body class="game-page">
    <header class="game-bar">
      <a class="game-back" href="/play/">← RedArcade</a>
      <span class="game-name">Memory</span>
      <span class="game-stat" id="stat">moves 0 · 0:00</span>
    </header>

    <main class="game-main">
      <div class="board-wrap">
        <div class="memory-board" id="board" aria-label="Memory board"></div>
        <div class="game-overlay" id="overlay">
          <h2 id="ov-title">Memory</h2>
          <p id="ov-text">Flip two cards. Match all eight pairs in as few moves as you can.</p>
          <button class="btn btn-primary" id="ov-btn">Start</button>
        </div>
      </div>
      <p class="game-help">click / tap a card · match all pairs</p>
    </main>

    <script>
      (() => {
        const boardEl = document.getElementById("board");
        const stat = document.getElementById("stat");
        const overlay = document.getElementById("overlay");
        const ovTitle = document.getElementById("ov-title");
        const ovText = document.getElementById("ov-text");
        const ovBtn = document.getElementById("ov-btn");

        const symbols = ["◆", "●", "▲", "■", "✦", "✚", "⬢", "◈"];

        let first = null;
        let second = null;
        let lock = false;
        let matchedPairs = 0;
        let moves = 0;
        let seconds = 0;
        let tick = null;
        let state = "ready";
        let best = 0;

        try {
          best = Number(localStorage.getItem("redarcade:memory:best") || 0);
        } catch {}

        function pad(value) {
          return String(value).padStart(2, "0");
        }

        function clock() {
          return `${Math.floor(seconds / 60)}:${pad(seconds % 60)}`;
        }

        function updateStat() {
          stat.textContent = `moves ${moves} · ${clock()}`;
        }

        function show(title, text, button) {
          ovTitle.textContent = title;
          ovText.textContent = text;
          ovBtn.textContent = button;
          overlay.hidden = false;
        }

        function hide() {
          overlay.hidden = true;
        }

        function shuffle(list) {
          for (let i = list.length - 1; i > 0; i -= 1) {
            const j = Math.floor(Math.random() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
          }
          return list;
        }

        function startTimer() {
          if (tick) return;
          tick = setInterval(() => {
            seconds += 1;
            updateStat();
          }, 1000);
        }

        function reset() {
          clearInterval(tick);
          tick = null;
          first = null;
          second = null;
          lock = false;
          matchedPairs = 0;
          moves = 0;
          seconds = 0;
          state = "ready";
          updateStat();

          const deck = shuffle([...symbols, ...symbols]);
          boardEl.innerHTML = "";

          for (const symbol of deck) {
            const card = document.createElement("button");
            card.type = "button";
            card.className = "mcard";
            card.dataset.symbol = symbol;
            card.textContent = symbol;
            boardEl.appendChild(card);
          }

          show("Memory", "Flip two cards. Match all eight pairs in as few moves as you can.", "Start");
        }

        function finish() {
          state = "won";
          clearInterval(tick);
          tick = null;

          if (!best || moves < best) {
            best = moves;
            try {
              localStorage.setItem("redarcade:memory:best", String(best));
            } catch {}
          }

          show("Cleared", `Moves ${moves} · ${clock()} · Best ${best}.`, "Play again");
        }

        function flip(card) {
          if (lock || card.classList.contains("matched") || card === first) return;

          if (state === "ready") {
            state = "running";
            hide();
            startTimer();
          }

          card.classList.add("flipped");

          if (!first) {
            first = card;
            return;
          }

          second = card;
          moves += 1;
          updateStat();

          if (first.dataset.symbol === second.dataset.symbol) {
            first.classList.add("matched");
            second.classList.add("matched");
            matchedPairs += 1;
            first = null;
            second = null;
            if (matchedPairs === symbols.length) finish();
            return;
          }

          const a = first;
          const b = second;
          first = null;
          second = null;
          lock = true;

          setTimeout(() => {
            a.classList.remove("flipped");
            b.classList.remove("flipped");
            lock = false;
          }, 700);
        }

        boardEl.addEventListener("click", (event) => {
          const card = event.target.closest(".mcard");
          if (card) flip(card);
        });

        ovBtn.addEventListener("click", () => {
          if (state === "won") reset();
          hide();
          state = "ready";
        });

        reset();
      })();
    </script>
  </body>
</html>
